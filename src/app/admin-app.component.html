<ion-app>
  <ion-header class="admin-header" [translucent]="true">
    <ion-toolbar>
      <ion-title class="admin-header-title">
        <span class="admin-brand-lockup">
          <img
            class="admin-brand-badge"
            src="assets/BistroBuddiesLogo.png"
            alt=""
          />
          <span class="admin-brand-wordmark">
            <span class="brand-bistro">Bistro</span>
            <span class="brand-buddies">Buddies</span>
          </span>
          <span class="admin-brand-tag">Admin</span>
        </span>
      </ion-title>
      @if (signedIn()) {
        <ion-buttons slot="end">
          @if (isAdmin()) {
            <admin-notifications-bell></admin-notifications-bell>
          }
          <ion-button (click)="logout()">
            <ion-icon slot="start" name="log-out"></ion-icon>
            <span class="logout-label">Log Out</span>
          </ion-button>
        </ion-buttons>
      }
    </ion-toolbar>
  </ion-header>

  <div class="admin-body">
    @if (signedIn() && !onLogin()) {
      <nav class="admin-nav" aria-label="Admin navigation">
        <span class="nav-group-label">Overview</span>
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          #dashboardLink="routerLinkActive"
          [attr.aria-current]="dashboardLink.isActive ? 'page' : null"
        >
          <ion-icon name="grid-outline" aria-hidden="true"></ion-icon>
          <span class="nav-label">Dashboard</span>
        </a>

        <span class="nav-group-label">Operations</span>
        <a
          routerLink="/products"
          routerLinkActive="active"
          #productsLink="routerLinkActive"
          [attr.aria-current]="productsLink.isActive ? 'page' : null"
        >
          <ion-icon name="cafe" aria-hidden="true"></ion-icon>
          <span class="nav-label">Products</span>
        </a>
        <a
          routerLink="/orders"
          routerLinkActive="active"
          #ordersLink="routerLinkActive"
          [attr.aria-current]="ordersLink.isActive ? 'page' : null"
        >
          <ion-icon name="receipt" aria-hidden="true"></ion-icon>
          <span class="nav-label">Orders</span>
        </a>
        <a
          routerLink="/messages"
          routerLinkActive="active"
          #messagesLink="routerLinkActive"
          [attr.aria-current]="messagesLink.isActive ? 'page' : null"
        >
          <ion-icon name="mail-outline" aria-hidden="true"></ion-icon>
          <span class="nav-label">Customer Messages</span>
        </a>
      </nav>
    }

    <ion-router-outlet></ion-router-outlet>
  </div>
</ion-app>
