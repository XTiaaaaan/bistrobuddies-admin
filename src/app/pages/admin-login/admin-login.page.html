<ion-content class="admin-login-content">
  <div class="admin-login-page">
    <div class="admin-login-card bb-rise">
      <div class="admin-login-hero">
        <img
          class="admin-login-logo"
          src="assets/BistroBuddiesLogo.png"
          alt="BistroBuddies logo"
        />
        <div class="admin-login-brand">
          <span class="brand-bistro">Bistro</span>
          <span class="brand-buddies">Buddies</span>
        </div>
        <p class="admin-login-tagline">Coffee Shop · Admin Portal</p>
      </div>

      <div class="admin-login-body">
      <h1 class="admin-login-title">Admin Sign In</h1>
      <p class="admin-login-subtitle">
        Manage the coffee menu, availability and incoming orders.
      </p>

      @if (errorMessage()) {
        <p class="admin-error" role="alert">{{ errorMessage() }}</p>
      }

      <form (ngSubmit)="signIn()">
        <ion-list lines="none" class="admin-login-fields">
          <ion-item>
            <ion-input
              label="Email"
              labelPlacement="stacked"
              type="email"
              name="email"
              autocomplete="username"
              placeholder="admin@example.com"
              [(ngModel)]="email"
            ></ion-input>
          </ion-item>
          <ion-item>
            <ion-input
              label="Password"
              labelPlacement="stacked"
              type="password"
              name="password"
              autocomplete="current-password"
              placeholder="Your password"
              [(ngModel)]="password"
            ></ion-input>
          </ion-item>
        </ion-list>

        <ion-button
          type="submit"
          expand="block"
          class="admin-login-submit"
          [disabled]="loading()"
        >
          @if (loading()) {
            <ion-spinner slot="start" name="crescent"></ion-spinner>
            {{ status() }}
          } @else {
            Sign In
          }
        </ion-button>
      </form>

        <p class="admin-login-note">
          Authorized staff only. Use the administrator account issued by
          BistroBuddies.
        </p>
      </div>
    </div>
  </div>
</ion-content>
